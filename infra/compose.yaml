services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scoutnews
      POSTGRES_USER: scoutnews
      POSTGRES_PASSWORD: scoutnews
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scoutnews-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutnews"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scoutnews-postgres:
