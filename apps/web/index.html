<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewsScout</title>
    <style>
:root {
  color-scheme: light;
  --cp-bg: #f3f4ef;
  --cp-bg-elevated: #e9ece7;
  --cp-sidebar: #e9ede7;
  --cp-surface: #fcfcf9;
  --cp-surface-soft: #e4eeea;
  --cp-border: #dce1da;
  --cp-border-strong: #aeb8b2;
  --cp-text: #17211e;
  --cp-text-muted: #66716c;
  --cp-text-soft: #4f5b56;
  --cp-accent: #275d52;
  --cp-accent-hover: #1d4a41;
  --cp-accent-soft: #e4eeea;
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
html, body, #root { min-height: 100%; margin: 0; }
body { background: var(--cp-bg); color: var(--cp-text); font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
/* Static first-paint frame; React replaces it on the first render. */
.ns-boot { min-height: 100vh; }
.ns-boot-side { position: fixed; inset: 0 auto 0 0; width: 176px; background: var(--cp-sidebar, var(--cp-bg-elevated)); border-right: 1px solid var(--cp-border); }
.ns-boot-brand { display: flex; align-items: center; gap: 9px; height: 76px; padding: 0 18px; font: 600 17px/1 Georgia, serif; }
.ns-boot-brand i { display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid var(--cp-text); border-radius: 50%; font-style: normal; }
.ns-boot-bar { display: none; }
.ns-boot-main { width: min(calc(100% - 176px), 1120px); margin-left: max(176px, calc(176px + (100vw - 176px - 1120px) / 2)); padding: 40px clamp(24px, 4vw, 56px); box-sizing: border-box; }
.ns-boot-main span { display: block; height: 14px; margin-bottom: 18px; border-radius: 6px; background: var(--cp-border); opacity: .55; }
.ns-boot-main span:nth-child(1) { width: 140px; height: 12px; }
.ns-boot-main span:nth-child(2) { width: min(420px, 70%); height: 38px; }
.ns-boot-main span:nth-child(3) { width: min(560px, 90%); }
@media (max-width: 768px) {
  .ns-boot-side { display: none; }
  .ns-boot-bar { display: flex; align-items: center; height: 56px; padding: 0 18px; border-bottom: 1px solid var(--cp-border); background: var(--cp-surface); }
  .ns-boot-bar .ns-boot-brand { height: auto; gap: 4px; padding: 0; font: 700 14px/1 "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
  .ns-boot-bar .ns-boot-brand i { width: auto; height: auto; border: 0; }
  .ns-boot-main { width: auto; margin-left: 0; padding: 24px 20px 60px; }
}
@media (prefers-reduced-motion: no-preference) { .ns-boot-main span { animation: ns-boot-pulse 1.4s ease-in-out infinite alternate; } }
@keyframes ns-boot-pulse { to { opacity: .25; } }
    </style>
  </head>
  <body><div id="root"><div class="ns-boot" aria-hidden="true"><div class="ns-boot-side"><div class="ns-boot-brand"><i>&#x1D4A9;</i>NewsScout</div></div><div class="ns-boot-bar"><div class="ns-boot-brand"><i>&#x1D4A9;</i>NewsScout</div></div><div class="ns-boot-main"><span></span><span></span><span></span></div></div></div><script type="module" src="/src/main.tsx"></script></body>
</html>
